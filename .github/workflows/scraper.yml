name: GSE Daily Scrape

on:
  schedule:
    # Off-peak minute on purpose: GitHub delays jobs scheduled on the hour by hours.
    # Self-heals anyway: main.py fetches every weekday after the last date in Data.csv.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # manual "Run workflow" button, no inputs needed

permissions:
  contents: write

concurrency:
  group: gse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NOTE: no Chrome install step. ubuntu-latest already ships Chrome and a
      # matching chromedriver. Installing google-chrome-stable on top is what
      # caused the "chromedriver might not be compatible" warnings in the log.
      - name: Install Python dependencies
        run: pip install selenium pandas requests beautifulsoup4 openpyxl

      # Starts from the day after the last date in Data.csv, weekdays only.
      # Also adds only the newest rows to Index.csv (GSE-CI / GSE-FSI / volume / market cap) via AJAX
      # and rebuilds GSE_Data.xlsx (sheets: "Data" + "Gse index").
      - name: Run GSE Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            error_screenshot.png
            scraper.log
            Data.csv
            Index.csv
            GSE_Data.xlsx
            downloads/
          if-no-files-found: ignore

      # always(): keep the days that were saved even if a later day failed
      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only add files that exist: one missing file used to abort the whole step
          for f in Data.csv Index.csv GSE_Data.xlsx scraper.log; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --quiet --cached || git commit -m "Update GSE data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
